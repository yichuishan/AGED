# Primary source: Gui et al., ECCV 2018, Sections 3.1, 3.3 and 4.
# Set K using preprocessing metadata; 54 is only a synthetic example in tests.
motion_dim: null
hidden_dim: 1024
num_actions: 15
observed_length: 50
prediction_length: 10  # 400 ms; override to 25 for 1 s or 100 for 4 s.
num_layers: 1
dropout: 0.0  # Not specified in paper; no stochastic dropout by default.
residual_prediction: true
# Assumptions, not confirmed paper facts; see IMPLEMENTATION_NOTES.md.
condition_decoder: true
share_recurrent_weights: false

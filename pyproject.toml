[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aged"
version = "0.2.0"
description = "Paper-based adversarial geometry-aware human motion prediction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
tracking = ["tensorboard>=2.15"]

[project.scripts]
aged-train = "aged.train:main"
aged-evaluate = "aged.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
